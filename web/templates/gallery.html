{% extends "base.html" %}
{% block title %}Photos{% endblock %}
{% block main_class %}wide{% endblock %}
{% block head %}
<style>
  /* Immich-like timeline: one section per day, justified rows (every tile keeps
     its photo's shape; layout() sizes each row so it fills the width exactly),
     a full-screen viewer with an info panel, and uploads by button or by
     dropping files on the page. */
  .gbar { display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap; }
  .gbar h1 { margin: 0; }
  .gactions { display: flex; align-items: center; gap: .5rem; }
  .gactions label { margin: 0; display: flex; align-items: center; gap: .4rem; }
  .gactions input { width: 9rem; }
  .day h2 { font-size: 14px; font-weight: 600; margin: 1.4rem 0 .5rem; color: #e6edf3; }
  .row { display: flex; flex-wrap: wrap; gap: 4px; }
  .tile { position: relative; flex: none; height: 220px; width: calc(var(--r) * 220px);   /* until layout() runs */
          padding: 0; border: 0; border-radius: 3px; overflow: hidden; background: #1c2128; cursor: pointer; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s; }
  .tile:hover img { transform: scale(1.03); }
  .tile::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .15s;
                 background: linear-gradient(to top, rgba(0,0,0,.6), transparent 45%); }
  .tile:hover::after, .tile:focus-visible::after { opacity: 1; }
  .tile .who { position: absolute; left: 8px; bottom: 6px; z-index: 1; color: #fff; font-size: 12px; font-weight: 600;
               opacity: 0; transition: opacity .15s; text-shadow: 0 1px 2px #000; }
  .tile:hover .who, .tile:focus-visible .who { opacity: 1; }
  .badge { position: absolute; z-index: 1; font-size: 12px; line-height: 18px; color: #fff; background: rgba(0,0,0,.55);
           border-radius: 999px; padding: 1px 7px; }
  .b-tr { top: 6px; right: 6px; } .b-tl { top: 6px; left: 6px; } .b-br { bottom: 6px; right: 6px; }
  .badge.new { background: #2f6feb; }
  .tile.hidden img { opacity: .3; filter: grayscale(1); }
  .tile.processing img { opacity: .5; }
  .tile.processing::before { content: ""; position: absolute; z-index: 2; left: 50%; top: 50%; width: 28px; height: 28px;
                             margin: -14px; border: 3px solid #ffffff55; border-top-color: #fff; border-radius: 50%;
                             animation: spin 1s linear infinite; }
  .tile .noimg { display: grid; place-items: center; width: 100%; height: 100%; color: #8a97a5; font-size: 13px; text-align: center; }
  .tile .noimg b { display: block; font-size: 30px; font-weight: 400; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 700px) { .row { gap: 2px; } }
  .empty { text-align: center; padding: 4rem 1rem; color: #8a97a5; }

  #drop { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; pointer-events: none;
          background: rgba(20, 60, 140, .35); border: 3px dashed #7cb3ff; font-size: 1.3rem; color: #fff; }
  #drop[hidden], #uploads[hidden] { display: none; }
  #uploads { position: fixed; right: 16px; bottom: 16px; z-index: 40; width: 330px; max-width: calc(100vw - 32px);
             max-height: 50vh; overflow: auto; background: #1c2128; border: 1px solid #30363d; border-radius: 10px;
             box-shadow: 0 8px 30px rgba(0,0,0,.5); padding: .4rem .8rem .6rem; }
  #uploads .uhead { display: flex; justify-content: space-between; align-items: center; color: #fff; font-weight: 600; }
  #uploads .uhead button { background: none; padding: .2rem .4rem; color: #8a97a5; }
  #uploads .u { padding: .4rem 0; border-top: 1px solid #262c36; font-size: 13px; }
  #uploads .name { display: flex; justify-content: space-between; gap: .5rem; }
  #uploads .name span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #uploads .st { color: #8a97a5; white-space: nowrap; }
  #uploads .msg { color: #ff8a8a; font-size: 12px; margin-top: 2px; }
  #uploads .bar { height: 4px; background: #30363d; border-radius: 4px; margin-top: 4px; overflow: hidden; }
  #uploads .bar i { display: block; height: 100%; width: 0; background: #2f6feb; transition: width .15s; }
  #uploads .u.ok .bar i { background: #3fb950; }
  #uploads .u.err .bar i { background: #f85149; }

  #viewer { position: fixed; inset: 0; z-index: 60; background: #000; display: flex; }
  #viewer[hidden] { display: none; }
  .vstage { position: relative; flex: 1; min-width: 0; touch-action: pan-y; }
  .vmedia { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 60px 64px 20px; }
  .vmedia img, .vmedia video { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .vtop { position: absolute; top: 0; left: 0; right: 0; z-index: 2; display: flex; align-items: center; gap: .4rem;
          padding: .5rem .75rem; background: linear-gradient(rgba(0,0,0,.75), transparent); }
  .vtitle { flex: 1; min-width: 0; color: #e6edf3; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vbtn { width: 40px; height: 40px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: #e6edf3;
          font-size: 18px; display: grid; place-items: center; text-decoration: none; cursor: pointer; }
  .vbtn:hover, .vbtn.on { background: rgba(255,255,255,.14); filter: none; }
  .vbtn[hidden] { display: none; }
  .vnav { position: absolute; top: 50%; z-index: 2; width: 48px; height: 48px; margin-top: -24px; padding: 0 0 4px;
          border: 0; border-radius: 50%; background: rgba(255,255,255,.08); color: #fff; font-size: 30px; line-height: 1; }
  .vnav:hover { background: rgba(255,255,255,.22); filter: none; }
  .vnav.prev { left: 10px; } .vnav.next { right: 10px; }
  .vnav[disabled] { visibility: hidden; }
  .vinfo { width: 360px; flex: none; overflow-y: auto; background: #1c2128; border-left: 1px solid #30363d; padding: 1rem 1.1rem 2rem; }
  .vinfo[hidden] { display: none; }
  .vinfo h3 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: #8a97a5; margin: 1.3rem 0 .5rem; }
  .vinfo h3:first-child { margin-top: .2rem; }
  .irow { display: flex; gap: .75rem; align-items: flex-start; margin: .6rem 0; }
  .irow .ic { width: 22px; flex: none; text-align: center; }
  .irow b { display: block; color: #e6edf3; font-weight: 600; }
  .irow small { color: #8a97a5; }
  .stats { display: grid; grid-template-columns: 1fr auto; gap: .3rem .75rem; font-size: 13px; }
  .stats span:nth-child(even) { color: #e6edf3; text-align: right; font-variant-numeric: tabular-nums; }
  .vinfo audio { width: 100%; display: block; margin: .25rem 0; }
  .reply { margin: .3rem 0 .7rem; } .reply small { color: #8a97a5; }
  .files { font-size: 12px; }
  .files div { display: flex; justify-content: space-between; gap: .5rem; padding: .25rem 0; border-bottom: 1px solid #262c36; }
  .files span:first-child { word-break: break-all; }
  .st-UNREAD { color: #7cb3ff; } .st-HIDDEN { color: #f5c451; } .st-PROCESSING { color: #8a97a5; }
  @media (max-width: 800px) {
    #viewer { flex-direction: column; }
    .vinfo { width: auto; max-height: 45vh; border-left: 0; border-top: 1px solid #30363d; }
    .vmedia { padding: 56px 8px 8px; }
    .vnav { width: 40px; height: 40px; margin-top: -20px; }
  }
</style>
{% endblock %}
{% block body %}
<div class="gbar">
  <h1>Photos <span class="muted" id="count"></span></h1>
  <div class="gactions">
    <label title="Shown as the sender, like a Telegram name">From <input id="sender" type="text" maxlength="32" placeholder="Your name"></label>
    <button id="uploadBtn" title="Or drop photos anywhere on the page">⬆ Upload</button>
    <input id="picker" type="file" accept="image/*" multiple hidden>
  </div>
</div>
<div id="gallery"><p class="muted">Loading…</p></div>

<div id="drop" hidden>Drop photos to send them to the frame</div>
<div id="uploads" hidden><div class="uhead">Uploads <button id="uploadsClose" title="Close">✕</button></div><div id="uploadList"></div></div>

<div id="viewer" hidden>
  <div class="vstage" id="vStage">
    <div class="vtop">
      <button class="vbtn" id="vClose" title="Close (Esc)">✕</button>
      <span class="vtitle" id="vTitle"></span>
      <a class="vbtn" id="vOpen" target="_blank" title="Open the original">⤢</a>
      <button class="vbtn" id="vInfoBtn" title="Info (i)">ⓘ</button>
    </div>
    <div class="vmedia" id="vMedia"></div>
    <button class="vnav prev" id="vPrev" title="Newer (←)">‹</button>
    <button class="vnav next" id="vNext" title="Older (→)">›</button>
  </div>
  <aside class="vinfo" id="vInfo"></aside>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dayFmt = new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
const timeFmt = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit' });
const whenFmt = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
const TYPES = { PHOTO: 'Photo', PHOTO_AUDIO: 'Photo with a voice note', VIDEO: 'Video', VIDEO_AUDIO: 'Video with a voice note', AUDIO: 'Voice note', OTHER: 'Other' };

let items = [], curId = null, showInfo = localStorage.getItem('gallery.info') !== '0', uploading = 0;

function ago(iso) {
  const s = Math.round((Date.now() - new Date(iso)) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)} h ago`;
  if (s < 30 * 86400) return `${Math.round(s / 86400)} days ago`;
  return whenFmt.format(new Date(iso));
}
function duration(s) {
  if (s < 60) return `${s} s`;
  if (s < 3600) return `${Math.floor(s / 60)} min ${s % 60} s`;
  return `${Math.floor(s / 3600)} h ${Math.floor(s % 3600 / 60)} min`;
}

/* ---------- timeline ---------- */
async function load() {
  const r = await fetch('/api/gallery', { cache: 'no-store' });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  items = (await r.json()).items;
  render();
  if (curId !== null) navButtons();
}

function render() {
  $('#count').textContent = items.length ? `· ${items.length}` : '';
  if (!items.length) {
    $('#gallery').innerHTML = '<div class="empty">No photos yet. Send one to the bot on Telegram, or use <b>Upload</b>.</div>';
    return;
  }
  let html = '', day = null;
  items.forEach((it, i) => {
    const d = it.created ? new Date(it.created) : null;
    const key = d ? d.toDateString() : '?';
    if (key !== day) {
      if (day !== null) html += '</div></section>';
      day = key;
      html += `<section class="day"><h2>${esc(d ? dayFmt.format(d) : 'Unknown date')}</h2><div class="row">`;
    }
    html += tile(it, i);
  });
  $('#gallery').innerHTML = html + '</div></section>';
  layout();
}

// Justified rows: fill each row with tiles at the target height, then scale
// the row so it spans the width exactly. The last row of a day isn't stretched.
function layout() {
  const target = window.innerWidth < 700 ? 130 : 230;
  document.querySelectorAll('#gallery .row').forEach(row => {
    const width = row.clientWidth, gap = parseFloat(getComputedStyle(row).columnGap) || 0;
    let line = [], sum = 0;
    const place = last => {
      const room = width - gap * (line.length - 1) - 0.5;        // 0.5 px of slack against rounding
      const h = last ? Math.min(target, room / sum) : room / sum;
      line.forEach(t => { t.style.height = h + 'px'; t.style.width = (+t.dataset.r * h) + 'px'; });
      line = []; sum = 0;
    };
    const fit = (n, total) => (width - gap * (n - 1)) / total;   // row height that fills the width
    for (const t of row.children) {
      const r = +t.dataset.r;
      // Would this tile squash the row further from the target than ending the row here?
      if (line.length && fit(line.length + 1, sum + r) < target &&
          Math.abs(fit(line.length, sum) - target) < Math.abs(fit(line.length + 1, sum + r) - target)) place(false);
      line.push(t); sum += r;
      if (fit(line.length, sum) <= target) place(false);
    }
    if (line.length) place(true);
  });
}
let layoutQueued = false;
new ResizeObserver(() => {
  if (!layoutQueued) { layoutQueued = true; requestAnimationFrame(() => { layoutQueued = false; layout(); }); }
}).observe($('#gallery'));

function tile(it, i) {
  const r = it.w && it.h ? (it.w / it.h).toFixed(4) : 1;
  const cls = ['tile', it.status === 'HIDDEN' && 'hidden', it.status === 'PROCESSING' && 'processing'].filter(Boolean).join(' ');
  const media = it.thumb
    ? `<img src="${esc(it.thumb)}" loading="lazy" alt="">`
    : `<span class="noimg"><span><b>${it.type === 'AUDIO' ? '🎙️' : '⏳'}</b>${it.type === 'AUDIO' ? 'Voice note' : 'Preparing…'}</span></span>`;
  let badges = '';
  if (it.video) badges += '<span class="badge b-tr" title="Video">▶</span>';
  if (it.voice && it.type !== 'AUDIO') badges += '<span class="badge b-br" title="Has a voice note">🎙️</span>';
  if (it.status === 'UNREAD') badges += '<span class="badge b-tl new" title="Nobody has stopped on it on the frame yet">New</span>';
  if (it.status === 'HIDDEN') badges += '<span class="badge b-tl" title="Hidden from the frame">Hidden</span>';
  return `<button class="${cls}" style="--r:${r}" data-r="${r}" data-i="${i}" aria-label="${esc(it.sender)}">${media}${badges}<span class="who">${esc(it.sender)}</span></button>`;
}

$('#gallery').addEventListener('click', e => {
  const t = e.target.closest('.tile');
  if (t) openViewer(+t.dataset.i);
});

/* ---------- viewer ---------- */
const curIndex = () => items.findIndex(it => it.id === curId);

function openViewer(i) {
  curId = items[i].id;
  $('#viewer').hidden = false;
  document.body.style.overflow = 'hidden';
  show();
}
function closeViewer() {
  $('#viewer').hidden = true;
  document.body.style.overflow = '';
  $('#vMedia').innerHTML = '';          // stops a playing video
  curId = null;
}
function step(delta) {
  const i = curIndex() + delta;
  if (i >= 0 && i < items.length) { curId = items[i].id; show(); }
}
function navButtons() {
  const i = curIndex();
  if (i < 0) return closeViewer();
  $('#vPrev').disabled = i <= 0;
  $('#vNext').disabled = i >= items.length - 1;
}
function show() {
  const it = items[curIndex()];
  if (!it) return closeViewer();
  const d = it.created ? new Date(it.created) : null;
  $('#vTitle').textContent = it.sender + (d ? ' · ' + whenFmt.format(d) : '');
  $('#vMedia').innerHTML = it.video
    ? `<video src="${esc(it.video)}" poster="${esc(it.thumb || '')}" controls autoplay playsinline></video>`
    : it.full ? `<img src="${esc(it.full)}" alt="">`
    : `<div class="muted">${it.type === 'AUDIO' ? '🎙️ Voice note, no photo' : 'Still being prepared…'}</div>`;
  const original = it.video || it.full;
  $('#vOpen').hidden = !original;
  if (original) $('#vOpen').href = original;
  $('#vInfo').innerHTML = info(it);
  $('#vInfo').hidden = !showInfo;
  $('#vInfoBtn').classList.toggle('on', showInfo);
  navButtons();
}

const irow = (ic, main, sub) => `<div class="irow"><span class="ic">${ic}</span><div><b>${main}</b>${sub ? `<small>${sub}</small>` : ''}</div></div>`;
function info(it) {
  const d = it.created ? new Date(it.created) : null, st = it.stats;
  let h = '<h3>Info</h3>';
  h += irow('👤', esc(it.sender), `sent from ${esc(it.source)}`);
  if (d) h += irow('📅', esc(dayFmt.format(d)), esc(timeFmt.format(d)));
  h += irow(it.video ? '🎬' : it.type === 'AUDIO' ? '🎙️' : '🖼️', esc(TYPES[it.type] || it.type), it.ow ? `${it.ow} × ${it.oh}` : '');
  h += irow('●', `<span class="st-${esc(it.status)}">${esc(it.status_label)}</span>`,
            st.first_seen ? 'first seen ' + esc(whenFmt.format(new Date(st.first_seen))) : '');
  h += '<h3>On the frame</h3><div class="stats">' + [
    ['Times shown', st.shown],
    ['Last shown', st.last_shown ? ago(st.last_shown) : 'never'],
    ['Time on screen', duration(st.dwell_s)],
    ['Opened again with the buttons', st.revisits],
    ['Voice replies recorded', st.voice_replies],
  ].map(([k, v]) => `<span>${k}</span><span>${esc(v)}</span>`).join('') + '</div>';
  if (it.voice) h += `<h3>Voice note</h3><audio controls preload="none" src="${esc(it.voice)}"></audio>`;
  if (it.replies.length) {
    h += '<h3>Replies recorded on the frame</h3>' + it.replies.map(r =>
      `<div class="reply"><small>${esc(whenFmt.format(new Date(r.at)))}</small><audio controls preload="none" src="${esc(r.url)}"></audio></div>`).join('');
  }
  h += '<h3>Files</h3><div class="files">' + it.files.map(f =>
    `<div><span>${esc(f.name)}</span><span class="muted">${esc(f.type.toLowerCase())} · ${esc(f.size)}${f.optimized ? '' : ' · processing'}</span></div>`).join('') + '</div>';
  return h + `<p><a href="/db#s${it.id}">Session #${it.id} in the database</a></p>`;
}

function toggleInfo() {
  showInfo = !showInfo;
  localStorage.setItem('gallery.info', showInfo ? '1' : '0');
  $('#vInfo').hidden = !showInfo;
  $('#vInfoBtn').classList.toggle('on', showInfo);
}
$('#vClose').onclick = closeViewer;
$('#vPrev').onclick = () => step(-1);
$('#vNext').onclick = () => step(1);
$('#vInfoBtn').onclick = toggleInfo;
document.addEventListener('keydown', e => {
  if ($('#viewer').hidden || e.target.matches('input, textarea')) return;
  if (e.key === 'Escape') closeViewer();
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'i') toggleInfo();
});
let touchX = null;                       // swipe between photos on phones
$('#vStage').addEventListener('touchstart', e => { touchX = e.touches.length === 1 ? e.touches[0].clientX : null; }, { passive: true });
$('#vStage').addEventListener('touchend', e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 60) step(dx < 0 ? 1 : -1);
  touchX = null;
});

/* ---------- uploads ---------- */
const sender = () => $('#sender').value.trim() || 'Web';
$('#sender').value = localStorage.getItem('gallery.sender') || '';
$('#sender').onchange = () => localStorage.setItem('gallery.sender', $('#sender').value.trim());
$('#uploadBtn').onclick = () => $('#picker').click();
$('#picker').onchange = () => { const files = [...$('#picker').files]; $('#picker').value = ''; uploadAll(files); };
$('#uploadsClose').onclick = () => { $('#uploads').hidden = true; $('#uploadList').innerHTML = ''; };

const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
let dragDepth = 0;
window.addEventListener('dragenter', e => { if (hasFiles(e)) { dragDepth++; $('#drop').hidden = false; } });
window.addEventListener('dragleave', e => { if (hasFiles(e) && --dragDepth <= 0) { dragDepth = 0; $('#drop').hidden = true; } });
window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener('drop', e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0; $('#drop').hidden = true;
  uploadAll([...e.dataTransfer.files]);
});

async function uploadAll(files) {
  const photos = files.filter(f => f.type.startsWith('image/') || /\.(jpe?g|png|webp|heic|heif|gif|bmp|tiff?)$/i.test(f.name));
  if (!photos.length) return;
  $('#uploads').hidden = false;
  uploading++;
  let sent = 0;
  for (const f of photos) if (await uploadOne(f)) sent++;
  uploading--;
  if (sent) { await load().catch(() => {}); waitForProcessing(); }
}

function uploadOne(file) {
  return new Promise(resolve => {
    const el = document.createElement('div');
    el.className = 'u';
    el.innerHTML = `<div class="name"><span>${esc(file.name)}</span><span class="st">0%</span></div><div class="bar"><i></i></div>`;
    $('#uploadList').prepend(el);
    const set = (pct, text) => { el.querySelector('.bar i').style.width = pct + '%'; el.querySelector('.st').textContent = text; };
    const fail = msg => {
      el.classList.add('err'); set(100, 'not sent');
      el.insertAdjacentHTML('beforeend', `<div class="msg">${esc(msg)}</div>`);
      resolve(false);
    };
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/upload');
    xhr.setRequestHeader('X-Requested-With', 'amonavision');
    xhr.upload.onprogress = e => { if (e.lengthComputable) { const p = Math.round(e.loaded / e.total * 100); set(p, p < 100 ? p + '%' : 'saving…'); } };
    xhr.onload = () => {
      let j = {};
      try { j = JSON.parse(xhr.responseText); } catch {}
      if (xhr.status === 200 && j.ok) { el.classList.add('ok'); set(100, 'sent to the frame'); resolve(true); }
      else fail(xhr.status === 413 ? 'Too big: the limit is 30 MB per photo.' : (j.error || `Error ${xhr.status}`));
    };
    xhr.onerror = () => fail('Network error.');
    const fd = new FormData();
    fd.append('photo', file);
    fd.append('sender', sender());
    xhr.send(fd);
  });
}

// New uploads are prepared for the frame in the background: refresh until they're ready.
async function waitForProcessing(tries = 20) {
  for (let n = 0; n < tries && items.some(it => it.status === 'PROCESSING'); n++) {
    await new Promise(r => setTimeout(r, 1500));
    await load().catch(() => {});
  }
}

// Photos sent on Telegram show up without reloading.
setInterval(() => {
  if (document.visibilityState === 'visible' && curId === null && !uploading) load().catch(() => {});
}, 60000);

load().catch(e => { $('#gallery').innerHTML = `<div class="empty">Could not load the photos (${esc(e.message)}).</div>`; });
</script>
{% endblock %}
